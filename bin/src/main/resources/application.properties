# DATABASE CONNECTION SETTINGS
spring.datasource.url=jdbc:mysql://localhost:3306/test_flower_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manilaspring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SPRING DATA JPA & HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=none

# Show generated SQL queries in the console log (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable the open-in-view warning log
spring.jpa.open-in-view=false
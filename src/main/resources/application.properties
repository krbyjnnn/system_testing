spring.datasource.url=jdbc:mysql://localhost:3306/test_flower_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Swing app, no embedded Tomcat needed (avoids the port 8080 clash with XAMPP)
spring.main.web-application-type=none

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false